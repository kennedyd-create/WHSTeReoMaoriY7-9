--f:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--fh:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.7rem;padding:.5rem .9rem;background:linear-gradient(135deg,var(--navy),var(--deep));color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.hdr .crest{height:38px;width:auto;background:#fff;border-radius:6px;padding:2px 5px;flex:none}
.hdr .ttl{min-width:0;flex:1}
.hdr .ttl b{display:block;font-size:1.1rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl small{display:block;font-size:.72rem;color:var(--light);opacity:.9;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.25rem .65rem;font-size:.8rem;font-weight:700;white-space:nowrap}
.hdr .pill.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:.5rem;padding:.35rem .6rem;font-weight:700;font-size:.85rem;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn[aria-pressed="true"]{background:var(--gold);color:var(--navy);border-color:var(--gold)}
@media(max-width:640px){.hdr .hide-s{display:none}.hdr .crest{height:32px}}
main{max-width:1100px;margin:0 auto;padding:1rem .9rem 3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.1rem 1.2rem;box-shadow:0 2px 0 rgba(0,32,102,.06)}
.stack{display:grid;gap:1rem}
h1,h2,h3{font-family:var(--fh);color:var(--navy);line-height:1.15}
h1{font-size:clamp(1.8rem,4vw,2.6rem)}
h2{font-size:1.45rem}
.kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--goldtext)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:.7rem;padding:.6rem 1rem;font-weight:800;font-size:1rem;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
/* title screen */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:0;overflow:hidden;padding:0}
.hero .art{background:var(--navy);min-height:260px;position:relative}
.hero .art svg{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{padding:1.4rem 1.5rem;display:grid;gap:.8rem;align-content:start}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .art{min-height:190px}}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.lvl{border:2px solid var(--line);background:#fff;border-radius:.8rem;padding:.6rem;text-align:left}
.lvl b{display:block;font-size:1.05rem}
.lvl span{font-size:.78rem;color:var(--muted)}
.lvl[aria-pressed="true"]{border-color:var(--navy);background:var(--light)}
.lvl.l1 b{color:#0e7490}.lvl.l2 b{color:#b91c1c}.lvl.l3 b{color:#a16207}
input.name{width:100%;font:inherit;font-size:1.05rem;padding:.6rem .8rem;border:2px solid var(--line);border-radius:.7rem}
label.lab{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);display:block;margin-bottom:.25rem}
/* scene + dialogue */
.play{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1rem;align-items:start}
@media(max-width:820px){.play{grid-template-columns:1fr}}
.scene{position:relative;border-radius:1rem;overflow:hidden;background:#bfdbfe;aspect-ratio:16/9;box-shadow:0 3px 0 rgba(0,32,102,.12)}
.scene>svg,.scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.scene .place{position:absolute;left:.7rem;bottom:.7rem;background:rgba(0,16,51,.82);color:#fff;border-radius:.6rem;padding:.35rem .7rem;max-width:80%}
.scene .place b{display:block;font-size:1.15rem;line-height:1.1}
.scene .place small{font-size:.75rem;color:var(--light)}
.scene .who{position:absolute;right:3%;bottom:0;width:30%;max-width:170px}
.scene .who svg{width:100%;height:auto;display:block}
.scene .cr{position:absolute;right:.4rem;top:.4rem;background:rgba(0,0,0,.45);color:#fff;font-size:.6rem;padding:.1rem .35rem;border-radius:.3rem}
.talk{display:grid;gap:.7rem}
.npc{display:flex;gap:.7rem;align-items:flex-start}
.npc .face{width:64px;height:64px;border-radius:50%;background:var(--light);flex:none;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.npc .face svg{width:100%;height:100%}
.bubble{background:#fff;border:2px solid var(--navy);border-radius:1rem;padding:.7rem .9rem;position:relative;flex:1;min-width:0}
.bubble .nm{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--goldtext)}
.bubble .reo{font-size:1.2rem;font-weight:700;color:var(--navy)}
.bubble .en{font-size:.88rem;color:var(--muted);font-style:italic;margin-top:.15rem}
.bubble.me{border-color:var(--gold);background:#fffbeb}
.hide-en .en{display:none}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:.8rem;padding:.6rem .85rem;font-size:1.05rem;font-weight:700;color:var(--ink);display:flex;gap:.6rem;align-items:center}
.opt:hover{border-color:var(--navy)}
.opt .k{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--light);color:var(--navy);display:grid;place-items:center;font-size:.85rem}
.opt .oen{display:block;font-size:.8rem;font-weight:500;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:#ecfdf5}
.opt.no{border-color:var(--bad);background:#fef2f2;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{border-radius:.8rem;padding:.6rem .85rem;font-size:.92rem}
.fb.ok{background:#ecfdf5;border:1px solid #86efac}
.fb.no{background:#fef2f2;border:1px solid #fca5a5}
.fb b{color:var(--navy)}
.qhead{font-size:1.15rem;font-weight:800;color:var(--navy)}
.prog{display:flex;gap:.3rem;flex-wrap:wrap}
.prog i{width:.7rem;height:.7rem;border-radius:50%;background:var(--line)}
.prog i.on{background:var(--gold)}.prog i.done{background:var(--navy)}
/* map */
.mapwrap{position:relative;background:linear-gradient(180deg,#bfdbfe,#93c5fd);border-radius:1rem;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto;max-height:72vh}
.pin{cursor:pointer}
.pin circle.hit{fill:transparent}
.pin:hover circle.dot,.pin:focus circle.dot{r:9}
/* kete */
.kete{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.5rem}
.kupu{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:.6rem;padding:.5rem .7rem}
.kupu b{display:block;color:var(--navy);font-size:1.05rem}
.kupu span{font-size:.82rem;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,16,51,.6);z-index:50;display:grid;place-items:center;padding:1rem}
.overlay .card{max-width:760px;width:100%;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.6rem 1rem;border-radius:.7rem;font-weight:700;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.stars{color:var(--gold);letter-spacing:.1em;font-size:1.1rem}
.cert{border:3px double var(--navy);border-radius:1rem;padding:1.4rem;text-align:center;background:#fffef7;display:grid;gap:.5rem;justify-items:center}
.cert img{height:70px}
.cert .big{font-size:2rem;font-weight:800;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{font-size:.75rem;font-weight:800;border-radius:999px;padding:.2rem .6rem;background:var(--light);color:var(--navy)}
.factbox{background:var(--light);border-radius:.8rem;padding:.7rem .9rem;font-size:.92rem}
.factbox b{color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.pick{border:2px solid var(--line);background:#fff;border-radius:.8rem;padding:.5rem;display:grid;gap:.3rem;justify-items:center;font-weight:800;color:var(--navy)}
.pick svg{width:100%;height:auto;border-radius:.5rem}
.pick:hover{border-color:var(--navy)}
.pick.ok{border-color:var(--ok);background:#ecfdf5}.pick.no{border-color:var(--bad);background:#fef2f2;animation:shake .3s}
@media print{.hdr,.noprint{display:none!important}body{background:#fff}}

/* Shared engine for the WHS te reo adventure games. Needs scenes.js, window.MAP, window.CREST, window.GAME (id, title, sub). */
(function(){
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d){ try { const v = localStorage.getItem(GAME.id + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(GAME.id + ':' + k, JSON.stringify(v)); } catch (e) {} }
};
const LV = { 1:['Novice 1', '#0e7490'], 2:['Novice 2', '#b91c1c'], 3:['Novice 3', '#a16207'] };
const ST = { name:'', lv:1, hint:true, stars:0, kete:[] };
const fill = s => String(s).replace(/\{name\}/g, ST.name || 'Hōhepa');

function header(){
  const h = document.createElement('header'); h.className = 'hdr';
  h.innerHTML = `<img class="crest" src="${CREST}" alt="Waiheke High School crest"><div class="ttl"><b>${esc(GAME.title)}</b><small>${esc(GAME.sub)}</small></div>
  <span class="pill hide-s" id="hLv" hidden></span><span class="pill gold" id="hStars" title="Whetū (stars)">★ 0</span>
  <button class="hbtn" id="hKete" type="button" title="Your kete of kupu">🧺<span class="hide-s"> Kete</span> <span id="hKn">0</span></button>
  <button class="hbtn" id="hHint" type="button" aria-pressed="true" title="Show English hints">EN<span class="hide-s"> hints</span></button>
  <button class="hbtn" id="hMenu" type="button" title="Back to the start">☰</button>`;
  document.body.prepend(h);
  $('#hHint').onclick = () => setHint(!ST.hint);
  $('#hKete').onclick = showKete;
  $('#hMenu').onclick = () => { if (confirm('Go back to the start screen? Your progress on this screen will be lost.')) location.reload(); };
}
function setHint(on){ ST.hint = on; document.body.classList.toggle('hide-en', !on); $('#hHint').setAttribute('aria-pressed', on); }
function setLevel(lv){ ST.lv = lv; const e = $('#hLv'); e.hidden = false; e.textContent = LV[lv][0]; e.style.background = LV[lv][1]; e.style.borderColor = LV[lv][1]; }
function addStars(n){ ST.stars += n; $('#hStars').textContent = '★ ' + ST.stars; }
function toast(msg, ms = 2200){ document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function addKupu(reo, en, quiet){ if (ST.kete.some(k => k[0] === reo)) return false; ST.kete.push([reo, en]); $('#hKn').textContent = ST.kete.length; if (!quiet) toast('🧺 Kua kohia: ' + reo + ' (' + en + ')'); return true; }
function overlay(html){ const o = document.createElement('div'); o.className = 'overlay'; o.innerHTML = `<div class="card">${html}<div class="row" style="margin-top:1rem;justify-content:flex-end"><button class="btn primary" data-close>Kati · Close</button></div></div>`; document.body.appendChild(o); o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-close]')) o.remove(); }); return o; }
function showKete(){ overlay(`<span class="kicker">Tō kete · your kete</span><h2 style="margin:.2rem 0 .8rem">${ST.kete.length} kupu collected</h2>${ST.kete.length ? `<div class="kete">${ST.kete.map(([r, e]) => `<div class="kupu"><b>${esc(r)}</b><span>${esc(e)}</span></div>`).join('')}</div>` : '<p class="muted">Talk to people and finish challenges to fill your kete.</p>'}`); }
const main = () => $('main');
function screen(html){ main().innerHTML = html; window.scrollTo(0, 0); return main(); }

/* Scene block: place label + optional person on the right */
function sceneHTML(type, label, sub, who, photo){
  const art = photo ? `<img src="${photo.src}" alt="${esc(label)}"><span class="cr">${esc(photo.credit)}</span>` : (SCENES[type] ? SCENES[type]() : '');
  return `<div class="scene">${art}${who ? `<div class="who">${PERSON(who)}</div>` : ''}${label ? `<div class="place"><b>${esc(label)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>` : ''}</div>`;
}

/* Conversation. npc = {name, role, look}. lines = [{say, en, opts:[{t, en, ok, re, reEn}], next}]; first opt with ok:true is correct.
   Lines without opts show a Next button. Returns Promise<number of mistakes>. */
function talk(host, npc, lines){
  return new Promise(resolve => {
    let i = 0, mistakes = 0;
    host.innerHTML = `<div class="talk"><div class="prog" id="tProg">${lines.map(() => '<i></i>').join('')}</div><div id="tLog" class="talk"></div><div id="tAct"></div></div>`;
    const log = $('#tLog', host), act = $('#tAct', host), prog = $('#tProg', host);
    const face = `<div class="face">${npc.face || PERSON(npc.look, true)}</div>`;
    const npcSay = (reo, en) => { const d = document.createElement('div'); d.className = 'npc'; d.innerHTML = `${face}<div class="bubble"><div class="nm">${esc(npc.name)}${npc.role ? ' · ' + esc(npc.role) : ''}</div><div class="reo">${esc(fill(reo))}</div>${en ? `<div class="en">${esc(fill(en))}</div>` : ''}</div>`; log.appendChild(d); };
    const meSay = (reo, en) => { const d = document.createElement('div'); d.className = 'npc'; d.style.flexDirection = 'row-reverse'; d.innerHTML = `<div class="face" style="background:#fde68a;display:grid;place-items:center;font-weight:900;color:#002066">Ko au</div><div class="bubble me"><div class="nm">${esc(ST.name || 'Ko koe')}</div><div class="reo">${esc(fill(reo))}</div>${en ? `<div class="en">${esc(fill(en))}</div>` : ''}</div>`; log.appendChild(d); };
    function step(){
      [...prog.children].forEach((x, k) => x.className = k < i ? 'done' : k === i ? 'on' : '');
      if (i >= lines.length) { act.innerHTML = ''; resolve(mistakes); return; }
      const L = lines[i];
      log.innerHTML = '';
      npcSay(L.say, L.en);
      if (!L.opts) { if (L.kupu) L.kupu.forEach(k => addKupu(k[0], k[1])); act.innerHTML = `<button class="btn primary">Haere tonu ▶</button>`; act.firstChild.onclick = () => { i++; step(); }; act.firstChild.focus(); return; }
      const opts = shuffle(L.opts.map((o, k) => Object.assign({ k }, o)));
      act.innerHTML = `<div class="small muted" style="margin:.2rem 0 .4rem;font-weight:700">${L.prompt ? esc(L.prompt) : 'Kōwhiria tō whakautu · Choose your reply'}</div><div class="opts">${opts.map((o, n) => `<button class="opt" data-k="${o.k}"><span class="k">${'ABCD'[n]}</span><span>${esc(fill(o.t))}${o.en ? `<span class="oen en">${esc(fill(o.en))}</span>` : ''}</span></button>`).join('')}</div><div id="tFb" style="margin-top:.6rem"></div>`;
      let tries = 0;
      act.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const o = L.opts[+b.dataset.k];
        if (o.ok) {
          b.classList.add('ok'); act.querySelectorAll('.opt').forEach(x => x.disabled = true);
          meSay(o.t, o.en);
          if (o.re) npcSay(o.re, o.reEn);
          if (L.kupu) L.kupu.forEach(k => addKupu(k[0], k[1]));
          $('#tFb', act).innerHTML = `<button class="btn primary">Haere tonu ▶</button>`;
          const nb = $('#tFb button', act); nb.onclick = () => { i++; step(); }; nb.focus();
        } else {
          tries++; mistakes++; b.classList.add('no'); b.disabled = true;
          const why = o.why || (o.en ? `You said “${fill(o.en)}”.` : '');
          $('#tFb', act).innerHTML = `<div class="fb no"><b>${esc(fill(o.re || 'Kāore au i te mārama. Anō?'))}</b> <span class="en">${esc(o.re ? (o.reEn || '') : 'I don’t understand. Again?')}</span><div class="small" style="margin-top:.2rem">${esc(why)} ${tries >= 2 && L.help ? esc(L.help) : 'Try another reply.'}</div></div>`;
        }
      });
    }
    step();
  });
}

/* One multiple-choice question card. q = {q, en, opts:[[text, ok, en]], explain, art}. Returns Promise<boolean firstTry> */
function ask(host, q){
  return new Promise(resolve => {
    const opts = shuffle(q.opts.map((o, k) => ({ t:o[0], ok:o[1], en:o[2], k })));
    host.innerHTML = `${q.art ? `<div style="margin-bottom:.7rem">${q.art}</div>` : ''}<div class="qhead">${esc(q.q)}</div>${q.en ? `<div class="en muted small" style="margin:.15rem 0 .6rem">${esc(q.en)}</div>` : '<div style="height:.5rem"></div>'}<div class="${q.grid ? 'grid2' : 'opts'}">${opts.map((o, n) => `<button class="opt" data-k="${n}"><span class="k">${'ABCD'[n]}</span><span>${esc(o.t)}${o.en ? `<span class="oen en">${esc(o.en)}</span>` : ''}</span></button>`).join('')}</div><div id="qFb" style="margin-top:.6rem"></div>`;
    let first = true;
    host.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const o = opts[+b.dataset.k];
      if (o.ok) { b.classList.add('ok'); host.querySelectorAll('.opt').forEach(x => x.disabled = true); $('#qFb', host).innerHTML = `<div class="fb ok"><b>${first ? pick(['Ka pai!', 'Ka rawe!', 'Tino pai!', 'Tika!']) : 'Ka pai, kua tika.'}</b> ${q.explain ? esc(q.explain) : ''}</div><div class="row" style="margin-top:.6rem"><button class="btn primary">Haere tonu ▶</button></div>`; const nb = $('#qFb button', host); nb.onclick = () => resolve(first); nb.focus(); }
      else { first = false; b.classList.add('no'); b.disabled = true; $('#qFb', host).innerHTML = `<div class="fb no"><b>Kāore i tika.</b> Not quite${o.en ? ` (“${esc(o.t)}” means “${esc(o.en)}”)` : ''}. Try again.</div>`; }
    });
  });
}

/* NZ map with pins. pins = [{id, label, x, y, state}] state: 'done'|'here'|'target'|'opt'|'' */
function mapSVG(pins, opts = {}){
  const W = MAP.w, H = MAP.h;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of Aotearoa New Zealand">${MAP.d.map(d => `<path d="${d}" fill="#86b86b" stroke="#4d7c0f" stroke-width=".8"/>`).join('')}${opts.route ? `<polyline points="${opts.route.map(p => p.join(',')).join(' ')}" fill="none" stroke="${'#b91c1c'}" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/>` : ''}
  ${opts.labels !== false ? `<text x="${W * .84}" y="${H * .3}" font-size="11" font-weight="800" fill="#1e3a8a" opacity=".6" text-anchor="middle">Te Ika-a-Māui</text><text x="${W * .14}" y="${H * .5}" font-size="11" font-weight="800" fill="#1e3a8a" opacity=".6" text-anchor="middle">Te Waipounamu</text><text x="${W * .82}" y="${H * .7}" font-size="10" font-style="italic" fill="#1e3a8a" opacity=".6" text-anchor="middle">Te Moana-nui-a-Kiwa</text>` : ''}
  ${pins.map(p => { const c = { done:'#002066', here:'#c5a059', target:'#b91c1c', opt:'#fff', '':'#fff' }[p.state || '']; const r = p.state === 'here' ? 8 : 6.5; const lx = p.lx != null ? p.lx : (MAP.side && MAP.side[p.id] != null ? MAP.side[p.id] * 11 : (p.x > W * .62 ? -10 : 10)); return `<g class="pin" data-pin="${esc(p.id)}" tabindex="${p.click ? 0 : -1}" role="${p.click ? 'button' : 'img'}" aria-label="${esc(p.label)}" ${p.click ? '' : 'style="cursor:default"'}><circle class="hit" cx="${p.x}" cy="${p.y}" r="16"/><circle class="dot" cx="${p.x}" cy="${p.y}" r="${r}" fill="${c}" stroke="#002066" stroke-width="2.2"/>${p.state === 'here' ? `<circle cx="${p.x}" cy="${p.y}" r="13" fill="none" stroke="#c5a059" stroke-width="2"><animate attributeName="r" values="9;16;9" dur="1.6s" repeatCount="indefinite"/></circle>` : ''}${p.label && opts.showLabels !== false ? `<text x="${p.x + lx}" y="${p.y + 4}" font-size="${p.state === 'opt' ? 12 : 10.5}" font-weight="800" fill="#002066" stroke="#fff" stroke-width="3" paint-order="stroke" text-anchor="${lx < 0 ? 'end' : 'start'}">${esc(p.label)}</text>` : ''}</g>`; }).join('')}</svg>`;
}
function bindPins(host, onPick){ host.querySelectorAll('.pin[tabindex="0"]').forEach(g => { const go = () => onPick(g.dataset.pin, g); g.addEventListener('click', go); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }); }); }

/* Title screen. cfg = {art, intro, levels:{1:'',2:'',3:''}, start(lv)} */

/* ---- completion codes, shareable certificate links and email ---- */
const SALT = 'whs-te-reo-2027';
function hash(str){ let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36).toUpperCase().padStart(7, '0').slice(-7); }
const codeOf = d => hash(SALT + [d.g, d.n, d.l, d.s, d.k, d.d, d.t].join('|'));
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
let LASTCERT = null;
function teacherEmail(){ const q = new URLSearchParams(location.search).get('kaiako'); if (q) { store.set('kaiako', q); return q; } return store.get('kaiako', ''); }
function share(){
  const d = LASTCERT; if (!d) return;
  const link = location.origin + location.pathname + '#cert=' + b64e(JSON.stringify(d));
  const subj = `Te reo certificate: ${d.n} completed ${GAME.title} (${LV[d.l][0]})`;
  const body = `Kia ora,\n\nI completed ${GAME.title} at ${LV[d.l][0]} on ${d.d}.\n${d.t}\nStars: ${d.s}. Kupu collected: ${d.k}.\nCompletion code: ${d.c}\n\nView and print my certificate here:\n${link}\n\nCould I please get WISE points for this?\n\nNgā mihi,\n${d.n}`;
  const host = document.querySelector('.cert'); if (!host) return;

      { say:'Tēnā koe! Ko Whaea Huia ahau, he kaiako.', en:'Greetings! I’m Whaea Huia, a teacher.', opts:[o('Tēnā koe, Whaea Huia.', 'Greetings, Whaea Huia.', 1), o('Kia ora, e tama.', 'Hi, boy.', 0, 'E tama? He kaiako ahau!', 'Boy? I’m a teacher!'), o('Tēnā kōrua.', 'Greetings to you two.', 0, null, null, 'Kōrua is for two people. Whaea Huia is one person: koe.')], kupu:[['kaiako', 'teacher']] },
      { say:'Ko wai tō ingoa?', en:'What is your name?', opts:[o('Ko {name} tōku ingoa.', 'My name is {name}.', 1), o('Ko Huia tōku ingoa.', 'My name is Huia.', 0, 'Kāo, ko Huia TŌKU ingoa!', 'No, Huia is MY name!'), o('Nō Waiheke ahau.', 'I’m from Waiheke.', 0)] },
      { say:'E hia ō tau?', en:'How old are you?', opts:[o('Tekau mā toru ōku tau.', 'I’m thirteen.', 1), o('Tekau mā whā ōku tau.', 'I’m fourteen.', 1), o('Tekau mā toru ō tau.', 'You are thirteen.', 0, null, null, 'ō = your, ōku = my.')] },
      { lv:[2, 3], say:'Nō hea koe?', en:'Where are you from?', opts:[o('Nō Waiheke ahau.', 'I’m from Waiheke.', 1), o('Kei Waiheke ahau.', 'I’m at Waiheke.', 0, null, null, 'Nō hea? asks where you are FROM: Nō … ahau.'), o('Ki Waiheke ahau.', 'To Waiheke me.', 0)] },
      { lv:[3], say:'Ko tēhea te marau pai rawa ki a koe? He aha ai?', en:'Which is your favourite subject? Why?', opts:[o('Ko te reo Māori, nā te mea he reo ātaahua.', 'Te reo Māori, because it’s a beautiful language.', 1, 'Kei te tika tāu!', 'You’re right!'), o('Ko te reo Māori.', 'Te reo Māori.', 0, 'He aha ai? Why?', 'Why?', 'Give a reason with nā te mea.'), o('Nā te mea, ko te kura.', 'Because, the school.', 0)], kupu:[['marau', 'school subject']] }
    ], after:() => { F.metHuia = 1; }, chain:() => F.clue && !F.ball ? 'huia' : null };
    if (F.clue && !F.ball) return { lines:[
      { say:'Ā, he pōro whero, he mā tēnei. Nā wai?', en:'Ah, this is a red and white ball. Whose is it?', opts:[o('Nā Tama.', 'It’s Tama’s.', 1, 'Anei. Hoatu ki a Tama.', 'Here. Give it to Tama.'), o('Nō Tama.', 'It’s Tama’s (o-form).', 0, null, null, 'A ball takes the a-category: Nā Tama.'), o('Nāku.', 'It’s mine.', 0, 'Nāu? Kāo!', 'Yours? No!')] }
    ], after:() => { F.ball = 1; toast('⚽ You have Tama’s ball. Take it to Onetangi!'); } };
    return { lines:[{ say:'Kia pai tō rā!', en:'Have a good day!' }] };
  case 'hemi':
    if (F.whakatauki) return { lines:[{ say:'Nāku te rourou, nāu te rourou, ka ora ai te iwi. Kaua e wareware!', en:'Don’t forget it!' }] };
    return { lines:[
      { say:'Tēnā koe, e moko. Nau mai ki te marae.', en:'Greetings, grandchild. Welcome to the marae.', opts:[o('Tēnā koe, Koro.', 'Greetings, Koro.', 1), o('Kia ora, e hoa!', 'Hi, mate!', 0, 'E hoa? Ko Koro ahau!', 'Mate? I’m Koro!', 'Use a respectful greeting for an elder: Tēnā koe, Koro.'), o('Ka kite, Koro.', 'See you, Koro.', 0)] },
      { say:'Whakarongo mai ki tēnei whakataukī: “Nāku te rourou, nāu te rourou, ka ora ai te iwi.”', en:'Listen to this whakataukī: “With my food basket and your food basket, the people will thrive.”', kupu:[['whakataukī', 'proverb; saying'], ['rourou', 'small food basket']] },
      { say:'He aha te tikanga o tēnei whakataukī?', en:'What does this whakataukī mean?', prompt:'Choose the meaning', opts:[o('When we all contribute, everyone thrives.', '', 1, 'Āe! Mā te mahi tahi.', 'Yes! By working together.'), o('Always eat your lunch.', '', 0, 'Kāo. Whakaarohia anō.', 'No. Think again.'), o('Baskets are heavy.', '', 0, 'Kāo. Whakaarohia anō.', 'No. Think again.')] },
      { lv:[2, 3], say:'Nāku te rourou, nāu te ___, ka ora ai te iwi.', en:'Fill the gap.', prompt:'Finish the whakataukī', opts:[o('rourou', '', 1), o('rākau', 'tree', 0), o('roimata', 'tear (crying)', 0)] },
      { lv:[3], say:'Ka āwhina koe i a Kui ki te tunu kai āpōpō?', en:'Will you help Kui cook tomorrow?', opts:[o('Āe, ka āwhina au i a ia.', 'Yes, I’ll help her.', 1, 'Koinā te tikanga o te whakataukī!', 'That’s what the whakataukī means!'), o('Āe, i āwhina au i a ia āpōpō.', 'Yes, I helped her tomorrow.', 0, null, null, 'Āpōpō (tomorrow) needs ka.'), o('Kei te tunu kai koe.', 'You are cooking.', 0)] },
      { say:'Haere rā, e moko.', en:'Goodbye, grandchild.', opts:[o('E noho rā, Koro.', 'Goodbye (to you staying), Koro.', 1), o('Haere rā, Koro.', 'Goodbye (to you leaving), Koro.', 0, null, null, FW), o('Ka kite, e hoa.', 'See you, mate.', 0)] }
    ], after:() => { F.whakatauki = 1; } };
  case 'tui':
    if (ST.lv < 2) return { lines:[
      { say:'Kia ora! Ko au te kāpene o te poti.', en:'Hi! I’m the captain of the ferry.', opts:[o('Kia ora, kāpene!', 'Hi, captain!', 1), o('Ka kite, kāpene!', 'See you, captain!', 0), o('He poti ahau.', 'I am a boat.', 0)], kupu:[['kāpene', 'captain']] },
      { say:'Ko te whā karaka te wā o te poti.', en:'The ferry’s time is four o’clock.', opts:[o('Ko te whā karaka. Ka pai!', 'Four o’clock. Great!', 1), o('Ko te rua karaka.', 'Two o’clock.', 0, 'Kāo, ko te whā!', 'No, four!'), o('Ko te iwa karaka.', 'Nine o’clock.', 0, 'Kāo, ko te whā!', 'No, four!')] }] };
    return { lines:[
      { say:'Kia ora! Ko au te kāpene o te poti.', en:'Hi! I’m the captain of the ferry.', opts:[o('Kia ora, kāpene!', 'Hi, captain!', 1), o('Ka kite, kāpene!', 'See you, captain!', 0), o('He poti ahau.', 'I am a boat.', 0)], kupu:[['kāpene', 'captain'], ['wehe', 'leave; depart']] },
      { say:'Ka wehe te poti ki Tāmaki ā te whā karaka.', en:'The ferry to Auckland leaves at four o’clock.', opts:[o('Āhea? Ā te whā karaka?', 'When? At four o’clock?', 1, 'Āe, ā te whā karaka.', 'Yes, at four o’clock.'), o('I te whā karaka?', 'At four o’clock (past)?', 0, null, null, 'The ferry hasn’t left yet: ā te whā karaka.'), o('Ā te tekau karaka?', 'At ten o’clock?', 0, 'Kāo, ā te whā!', 'No, at four!')] },
      { lv:[3], say:'Ka haere koe ki Tāmaki āpōpō?', en:'Will you go to Auckland tomorrow?', opts:[o('Kāo, ka noho au ki Waiheke āpōpō.', 'No, I’ll stay on Waiheke tomorrow.', 1), o('Āe, ka haere au ki Tāmaki āpōpō.', 'Yes, I’ll go to Auckland tomorrow.', 1), o('Āe, i haere au ki Tāmaki āpōpō.', 'Yes, I went to Auckland tomorrow.', 0, null, null, 'Āpōpō needs ka.')] },
      { say:'Haere rā!', en:'Goodbye!', opts:[o('E noho rā, kāpene!', 'Goodbye (to you staying), captain!', 1), o('Haere rā, kāpene!', 'Goodbye (to you leaving), captain!', 0, null, null, FW), o('Mōrena!', 'Morning!', 0)] }
    ], after:() => { F.time = 1; toast('⛴️ The ferry leaves at four o’clock. Tell Kui!'); } };
  }
}

function villageSVG(next){
  const island = 'M20 128 Q 30 92 70 98 Q 100 80 130 86 Q 160 60 200 74 Q 240 60 280 70 Q 330 58 372 80 Q 392 100 372 128 Q 386 160 350 188 Q 300 214 250 200 Q 210 222 170 200 Q 120 212 90 180 Q 50 176 36 156 Q 14 150 20 128 Z';
  const roads = 'M48 116 L118 120 L150 96 M118 120 L198 168 L250 150 L300 178 M250 150 L330 92';
  const svg = `<svg viewBox="0 0 400 250" role="img" aria-label="Map of Waiheke village"><rect width="400" height="250" fill="#7cc3ef"/>${[0, 1, 2, 3, 4].map(i => `<path d="M${10 + i * 85} ${20 + (i % 2) * 210} q 12 -5 24 0 t 24 0" stroke="#bfe3f8" stroke-width="2" fill="none"/>`).join('')}<path d="${island}" fill="#86b86b" stroke="#4d7c0f" stroke-width="2"/><path d="${island}" fill="none" stroke="#f2d38a" stroke-width="5" opacity=".6"/><path d="${roads}" stroke="#fff" stroke-width="4" fill="none" stroke-dasharray="1 0" opacity=".8"/><path d="${roads}" stroke="#a8a29e" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/><text x="200" y="240" text-anchor="middle" font-size="11" font-weight="800" fill="#002066" opacity=".7">Tīkapa Moana</text>
    ${PLACES.map(p => { const hot = next && next === p.id; return `<g class="pin" data-pin="${p.id}" tabindex="0" role="button" aria-label="${esc(p.reo)}: ${esc(p.en)}"><circle class="hit" cx="${p.x}" cy="${p.y}" r="22"/>${hot ? `<circle cx="${p.x}" cy="${p.y}" r="20" fill="none" stroke="#c5a059" stroke-width="3"><animate attributeName="r" values="16;23;16" dur="1.5s" repeatCount="indefinite"/></circle>` : ''}<circle class="dot" cx="${p.x}" cy="${p.y}" r="15" fill="#fff" stroke="#002066" stroke-width="2.5"/><text x="${p.x}" y="${p.y + 6}" text-anchor="middle" font-size="16">${p.icon}</text><text x="${p.x}" y="${p.y + (p.ly || 29)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#002066" stroke="#fff" stroke-width="3" paint-order="stroke">${esc(p.reo)}</text></g>`; }).join('')}</svg>`;
  return svg;
}
function mapView(){
  const t = tasks(); const next = t.find(x => !x[3]);
  const svg = villageSVG(next && next[0]);
  const m = screen(`<div class="play"><div class="card" style="padding:.6rem"><div class="mapwrap" id="vmap">${svg}</div><p class="small muted" style="margin:.5rem .3rem 0">Click a place to walk there. The gold ring shows your next task.</p></div>
    <div class="stack"><div class="card"><span class="kicker">Ngā mahi o te rā · today’s tasks</span><div class="stack" style="gap:.45rem;margin-top:.6rem">${t.map(([p, reo, en, done]) => `<div style="display:flex;gap:.6rem;align-items:flex-start;${done ? 'opacity:.55' : ''}"><span style="font-size:1.2rem">${done ? '✅' : '⬜'}</span><div><b style="color:#002066">${esc(reo)}</b><div class="en small muted">${esc(en)}</div></div></div>`).join('')}</div></div>
    <div class="card small"><span class="kicker">Whanaungatanga · relationships</span><div class="chips" style="margin-top:.4rem">${Object.entries(PEOPLE).map(([k, p]) => `<span class="chip">${esc(p.name)} ${HEART[k] != null ? '❤'.repeat(HEART[k]) + '♡'.repeat(3 - HEART[k]) : '·'}</span>`).join('')}</div></div></div></div>`);
  A.bindPins(m, id => visit(id));
}

async function visit(id, chained){
  const p = PBY[id], who = PEOPLE[p.who];
  if (!chained) { screen(`<div class="card" style="max-width:640px;margin:2rem auto;text-align:center"><div style="font-size:3rem">🚶</div><h2>${id === 'kainga' ? 'Kei te hoki au ki te kāinga.' : `Kei te haere au ki ${esc(p.reo === 'Onetangi' || p.reo === 'Mātiatia' ? p.reo : p.reo.replace(/^Te /, 'te '))}.`}</h2><p class="en muted">${id === 'kainga' ? 'I’m going home.' : `I’m going to ${esc(p.en.replace(/^The /, 'the '))}.`}</p></div>`); await A.sleep(1100); }
  const sc = script(p.who);
  const m = screen(`<div class="play"><div class="stack">${sceneHTML(p.scene, p.reo, p.en, who.look)}<div class="row"><button class="btn" id="back">← Ki te mahere · back to the map</button></div></div><div class="card" id="tk"></div></div>`);
  $('#back').onclick = mapView;
  const lines = sc.lines.filter(atLv);
  const mistakes = await talk($('#tk', m), who, lines);
  if (lines.some(l => l.opts)) { const h = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1; HEART[p.who] = Math.max(HEART[p.who] || 0, h); addStars(h); }
  if (sc.after) sc.after();
  const nxt = sc.chain && sc.chain();
  if (nxt) return visit(id, true);
  if (F.home) return finish();
  $('#tk', m).insertAdjacentHTML('beforeend', `<div class="row" style="margin-top:.8rem"><button class="btn primary" id="tomap">Ki te mahere · to the map ▶</button></div>`);
  $('#tomap').onclick = mapView; $('#tomap').focus();
}

function finish(){
  const people = Object.keys(HEART).length, hearts = Object.values(HEART).reduce((a, b) => a + b, 0);
  const [rr, re] = rank(hearts / Math.max(1, people * 3));
  screen(`<div class="stack" style="max-width:760px;margin:0 auto">${certificate({ title:rr + ' ' + re, line:`spent a day on Waiheke, finished every task, talked with ${people} people and collected ${ST.kete.length} kupu.` })}
    <div class="card"><h2 style="margin-bottom:.6rem">Whanaungatanga · your relationships</h2><div class="chips">${Object.entries(HEART).map(([k, h]) => `<span class="chip" style="font-size:.9rem">${esc(PEOPLE[k].name)} ${'❤'.repeat(h)}${'♡'.repeat(3 - h)}</span>`).join('')}</div></div>
    <div class="card"><h2 style="margin-bottom:.6rem">Tō kete · your kete</h2><div class="kete">${ST.kete.map(([r, e]) => `<div class="kupu"><b>${esc(r)}</b><span>${esc(e)}</span></div>`).join('')}</div></div>
    <div class="row noprint" style="justify-content:center"><button class="btn" onclick="window.print()">🖨 Print certificate</button><button class="btn primary" onclick="location.reload()">Tākaro anō · Play again</button></div></div>`);
}

/* patch talk() so kupu on lines are collected (handled in common via L.kupu) */
header();
title({ art:`<div style="position:absolute;inset:0;display:grid;place-items:center;background:#7cc3ef">${villageSVG(null).replace('<svg ', '<svg style="width:100%;height:auto;position:static" ')}</div>`,
  intro:'Kui has sent you out for the day. Walk around Waiheke, talk with the people you meet and finish your list of tasks: buy the kai, find Tama’s lost ball, learn a whakataukī at the marae and get home in time for kai. Good kōrero builds your whanaungatanga ❤.',
  levels:{ 1:'Greetings, names, colours, numbers', 2:'Plus time, a/o, nō hea, ferry task', 3:'Plus past tense, reasons, i/kei' },
  start:() => mapView() });
})();
