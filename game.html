<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te Reo Wero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&family=Saira+Condensed:wght@500;600;700;800&family=Saira+Stencil+One&display=swap">
<style>
/* Layout: night HUD across the top, a field-notebook question card in the centre, with a poutama (stairway) band behind it. Same look as Aotearoa Map Skills. */
:root{ color-scheme:light;
  --night:#0a1626; --night-line:rgba(190,215,240,.22);
  --paper:#eef1ec; --paper-2:#e1e7df; --paper-line:rgba(36,86,128,.09); --rule:#c5cfc6;
  --ink:#142235; --ink-soft:#4a5b6d; --ink-faint:#7a8896;
  --hivis:#ffc93c; --hivis-deep:#d99a00; --hivis-ink:#2a1e00;
  --alert:#c8323b; --alert-soft:#f6dcdc; --ok:#23804f; --ok-soft:#d8efe1;
  --f-stencil:"Saira Stencil One","Saira Condensed",Impact,sans-serif; --f-head:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; }
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--hivis);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
#hud .crest{height:34px;width:auto;background:#fff;border-radius:5px;padding:2px 4px;flex:none}
.cert .crest{height:64px;width:auto}
.sharebox{border:2px solid var(--ink);padding:12px 14px;background:#fff;margin:12px 0}
#hud{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--night);color:#dfe9f3;border-bottom:1px solid var(--night-line)}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--f-stencil);font-weight:400;font-size:20px;letter-spacing:.04em;color:var(--hivis);white-space:nowrap}
.brand small{font-family:var(--f-head);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#93a8be;white-space:nowrap}
#progress{flex:1;display:flex;align-items:center;gap:10px;min-width:0;justify-content:center}
.case-tag{font-family:var(--f-head);font-weight:700;letter-spacing:.12em;font-size:13px;color:#bcd0e3;white-space:nowrap}
.dots{display:flex;gap:4px;flex-wrap:wrap;max-width:420px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid #6f8aa6;display:block}
.dots i.good{background:var(--ok);border-color:#5fd197}.dots i.part{background:var(--hivis);border-color:var(--hivis)}.dots i.miss{background:var(--alert);border-color:#ff8a90}.dots i.now{border-color:var(--hivis);box-shadow:0 0 0 3px rgba(255,201,60,.25)}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.stat span{font-family:var(--f-head);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8ea4ba}
.stat b{font-family:var(--f-mono);font-size:15px;font-weight:600;color:#fff}
.hud-btn{background:transparent;border:1px solid var(--night-line);border-radius:6px;padding:6px 10px;color:#dfe9f3;font-family:var(--f-head);font-weight:600;letter-spacing:.06em;font-size:14px;white-space:nowrap}
.hud-btn:hover{border-color:var(--hivis);color:var(--hivis)}
#stage{position:relative;min-height:calc(100% - 56px);display:flex;justify-content:center;padding:28px 16px 48px;overflow:hidden}
#bg{position:absolute;inset:0;opacity:.16;pointer-events:none}
#card{position:relative;width:min(760px,100%);background:var(--paper);background-image:linear-gradient(var(--paper-line) 1px,transparent 1px),linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);background-size:22px 22px;border:1.5px solid #000;box-shadow:8px 8px 0 rgba(0,0,0,.45);padding:22px 24px;display:flex;flex-direction:column;gap:16px;align-self:flex-start}
.eyebrow{font-family:var(--f-head);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.stop-title{font-family:var(--f-head);font-weight:800;font-size:28px;line-height:1.05}
.task{--tc:var(--hivis);background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:4px 4px 0 var(--ink)}
.task-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.task-kind{font-family:var(--f-head);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.task-kind::before{content:"";display:inline-block;width:10px;height:10px;background:var(--tc);border:1.5px solid var(--ink);margin-right:7px;vertical-align:-1px}
.task-count{font-family:var(--f-mono);font-size:12px;color:var(--ink-faint)}
.prompt{font-size:18px;line-height:1.45}
.prompt .reo{font-family:var(--f-head);font-weight:800;font-size:28px;line-height:1.15;display:block;margin-top:4px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:10px 12px;font-size:17px;line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--ink);background:#fff}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--alert-soft);border-color:var(--alert);text-decoration:line-through;color:var(--ink-soft)}
.opt:disabled{cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--hivis);color:var(--hivis-ink);border:1.5px solid var(--ink);border-radius:6px;padding:10px 16px;font-family:var(--f-head);font-weight:800;font-size:17px;letter-spacing:.05em;text-transform:uppercase;box-shadow:3px 3px 0 var(--ink)}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--rule);color:var(--ink-soft);font-size:14px;padding:7px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{border-radius:6px;padding:10px 12px;font-size:15px;line-height:1.4}
.fb.good{background:var(--ok-soft);border:1.5px solid var(--ok)}.fb.bad{background:var(--alert-soft);border:1.5px solid var(--alert)}.fb.info{background:var(--paper-2);border:1.5px solid var(--rule)}
.fb b.pts{font-family:var(--f-mono);float:right;margin-left:8px}
.tip{font-size:14px;color:var(--ink-soft);border-top:1px dashed var(--rule);padding-top:10px;margin:0}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.tile{background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:8px 12px;font-family:var(--f-head);font-weight:700;font-size:19px;box-shadow:2px 2px 0 var(--ink)}
.tile:hover:not(:disabled){background:var(--hivis)}
.tile:disabled{opacity:.25;box-shadow:none}
.answer{min-height:54px;border:1.5px dashed var(--ink-soft);border-radius:6px;padding:8px;background:#fffef9}
.answer .tile{background:var(--paper-2)}
.typebox{width:100%;box-sizing:border-box;font-family:var(--f-head);font-size:24px;font-weight:700;padding:10px 12px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink)}
.mac{display:flex;gap:6px;flex-wrap:wrap}
.mac button{width:44px;height:40px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;font-family:var(--f-head);font-weight:800;font-size:20px}
.mac button:hover{background:var(--hivis)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .opt.sel{border-color:var(--ink);background:var(--hivis)}
.match .opt.done{background:var(--ok-soft);border-color:var(--ok);opacity:.7}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;color:var(--alert)}
/* modals */
.scrim{position:fixed;inset:0;background:rgba(5,12,22,.72);display:grid;place-items:center;z-index:50;padding:16px;overflow-y:auto}
.sheet{background:var(--paper);background-image:linear-gradient(var(--paper-line) 1px,transparent 1px),linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);background-size:22px 22px;border:1.5px solid #000;box-shadow:8px 8px 0 rgba(0,0,0,.45);width:min(900px,100%);max-height:calc(100% - 8px);overflow-y:auto;position:relative}
.sheet-pad{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.big-title{font-family:var(--f-stencil);font-weight:400;font-size:clamp(34px,6vw,58px);line-height:.95;letter-spacing:.02em}
.title-screen{display:grid;grid-template-columns:1fr 1.25fr}
.title-art{background:#0d1e33;min-height:420px;position:relative;border-right:1.5px solid #000;overflow:hidden;display:flex;align-items:flex-end;padding:20px;color:#fff}
.title-art svg{position:absolute;inset:0;width:100%;height:100%}
.title-art p{position:relative;font-family:var(--f-head);font-size:22px;font-weight:700;line-height:1.15;margin:0;text-shadow:0 2px 8px #000}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-family:var(--f-head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--ink-soft)}
.field input[type=text]{font-family:var(--f-body);font-size:18px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{position:relative;display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;font-family:var(--f-head);font-weight:700;font-size:15px;cursor:pointer;user-select:none}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .sw{width:12px;height:12px;border:1.5px solid var(--ink);background:#fff;border-radius:3px}
.tog:has(input:checked){background:var(--ink);color:#fff}
.tog:has(input:checked) .sw{background:var(--c,var(--hivis));border-color:#fff}
.tog.radio .sw{border-radius:50%}
.mini{font-family:var(--f-head);font-size:13px;font-weight:700;background:none;border:0;text-decoration:underline;color:var(--ink-soft);padding:0}
.cert{border:3px double var(--ink);padding:20px;text-align:center;background:#fffef9;display:flex;flex-direction:column;gap:8px;align-items:center}
.cert .rank{font-family:var(--f-stencil);font-size:32px;color:var(--alert);line-height:1.05}
.cert .pct{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,14em) minmax(0,1fr) 5.5em;gap:10px;align-items:center;font-size:14.5px}
.bar-row .nm{font-family:var(--f-head);font-weight:700;font-size:15px}
.bar-track{height:14px;background:#fff;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--c)}
.bar-row .v{font-family:var(--f-mono);font-size:13px;text-align:right}
.review{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.review li{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--rule);border-radius:4px;padding:5px 8px;font-size:14px;min-width:0}
.review li span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review li b{font-family:var(--f-mono);font-size:12.5px}
.review li i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){.title-screen{grid-template-columns:1fr}.title-art{min-height:150px;border-right:none;border-bottom:1.5px solid #000}.brand small{display:none}.dots{display:none}.stat span{display:none}.bar-row{grid-template-columns:minmax(0,1fr) 5em}.bar-row .bar-track{grid-column:1 / -1;grid-row:2}.match{grid-template-columns:1fr}}
@media (max-width:520px){.brand{display:none}.hud-btn .lbl-long{display:none}#card{padding:16px}}
</style>
</head>

<script>
const G = {"n1":{"name":"Novice 1","col":"#0e7490","topics":[{"id":"n1-greet","name":"Greetings and farewells","code":"N1.1","pairs":[["Kia ora","Hello; thank you; I agree"],["Tēnā koe","Hello (to one person, formal)"],["Tēnā kōrua","Hello (to two people)"],["Tēnā koutou","Hello (to three or more)"],["Mōrena","Good morning"],["Ata mārie","Good morning (modern phrase)"],["Kia pai te rā","Have a good day"],["Haere rā","Goodbye (to someone leaving)"],["E noho rā","Goodbye (to someone staying)"],["Ka kite","See you (colloquial)"],["Pō mārie","Good night"],["Hongi","Pressing noses; sharing breath"],["Harirū","Handshake"],["Ngā mihi","Regards; greetings"],["Ngā mihi maioha","Warm regards"],["Nā","From; by"],["Īmēra","Email"],["Reta","Letter"],["Ko wai koe?","Who are you?"],["Kei te pēhea koe?","How are you?"]],"sents":[["Kia ora koutou","Hello everyone"],["Mōrena, e hoa","Good morning, friend"],["Tēnā kōrua","Hello, you two"],["Kia pai te rā","Have a good day"],["Ngā mihi o te ata","Morning greetings"]],"qa":[["You greet three or more people. Which greeting?","Tēnā koutou",["Tēnā koe","Tēnā kōrua","Pō mārie"],"Koutou is for three or more people."],["You are leaving; your friends are staying. What do you say?","E noho rā",["Haere rā","Pō mārie","Mōrena"],"E noho rā is said BY the person leaving TO those staying."],["Your friend is leaving your house. What do you say?","Haere rā",["E noho rā","Ata mārie","Tēnā koutou"],"Haere rā is said TO the person leaving."],["It is 7 pm and you arrive at a hui. Can you say “Pō mārie”?","No: pō mārie is only a goodnight",["Yes, it means good evening","Yes, for any time after dark","Only to one person"],"Pō mārie is a modern phrase for “good night”; it is never an evening greeting."],["What does “Kia ora” literally express?","A wish for someone’s wellness",["Good morning","Goodbye forever","I am hungry"],"Kia ora wishes wellness; it is used for hello, thanks and agreement."],["Which sign-off means “warm regards”?","Ngā mihi maioha",["Nāku noa","Ka kite","Hei āpōpō"],"Ngā mihi maioha = warm regards; Nāku noa, nā ___ = yours sincerely, from ___."],["Why can’t you say “Ka kite koe” as a farewell?","“Ka kite” is short for “ka kite au i a koe”",["It is rude","Koe is plural","It is only for night"],"The full phrase already includes “koe”."]],"gen":null,"macron":false,"tip":"Think: how many people, what time of day, and who is leaving?"},{"id":"n1-sounds","name":"Sounds and spelling","code":"N1.1","pairs":[["Te arapū Māori","The Māori alphabet"],["Oro","Sound"],["Tohutō","Macron"],["Pūriki","Particle"],["Wahine","Woman"],["Wāhine","Women"],["Keke","Cake"],["Kēkē","Armpit"],["Whakarongo","Listen"],["Ngā","The (plural)"],["Rangi","Sky; day"],["Tito","Make up; compose"],["Mita","Dialect; accent"],["Iwi","Tribe; people"],["Rohe","Region; territory"]],"sents":[],"qa":[["How many letters are in te arapū Māori?","15",["26","10","5"],"5 vowels, 8 consonants and 2 digraphs."],["Which are the two digraphs?","ng and wh",["th and sh","ch and ph","ng and th"],"Ng and wh are single sounds written with two letters."],["How is “r” said in te reo?","Tapped: the tongue taps the roof of the mouth",["Rolled for a long time","Silent","Like English “r” in “car”"],"The r is tapped, not rolled."],["“wh” is usually said like…","English “f”",["English “w”","English “v”","English “h”"],"Wh is usually like f."],["“wahine” means woman. What does “wāhine” mean?","Women",["Girl","Wife","Man"],"The tohutō (macron) changes the meaning."],["Every Māori word ends in…","a vowel",["a consonant","ng","h"],"Every Māori word ends in a vowel."],["In Ngāi Tahu dialect, “ng” often becomes…","k (Kāi Tahu)",["n","w","h"],"Ngāi Tahu uses k for ng: Kāi Tahu, kāika."],["In Ngāpuhi dialect, “whakarongo” can sound like…","hakarongo",["fakarongo","whakarono","wakarongo"],"Ngāpuhi often drops the w."]],"gen":null,"macron":true,"tip":"Say the word slowly. Which vowels are long?"},{"id":"n1-karakia","name":"Karakia","code":"N1.9","pairs":[["Karakia","Incantation; chant for a purpose"],["Inoi","Prayer (religious)"],["Tīmatanga","Beginning"],["Whakamutunga","Ending"],["Kia karakia tātou","Let us do karakia"],["Tākina te karakia","Recite the karakia"],["Hui e! Tāiki e!","Closing call: joined together, bound as one"]],"sents":[["Kia karakia tātou","Let us do karakia"],["Tākina te karakia","Recite the karakia"]],"qa":[["Did karakia exist before Christianity arrived in Aotearoa?","Yes",["No","Only on marae","Only in the 1900s"],"Karakia predate the arrival of Christianity."],["What is a religious prayer often called, to tell it apart from karakia?","Inoi",["Waiata","Mihi","Haka"],"Inoi are religious prayers; use them only in appropriate settings."],["Which is NOT a usual purpose of karakia?","Winning an argument",["Opening a gathering","Supporting learning","Acknowledging the environment"],"Karakia open and close gatherings, support learning, protection, wellbeing and acknowledge the environment."],["How do we behave during karakia?","Stand or sit still, quiet and focused",["Keep working","Talk quietly","Leave the room"],"It shows respect for its purpose and the people present."],["“Hui e! Tāiki e!” is said…","At the end of a karakia",["At the start of a haka","As a greeting","As a question"],"It closes many karakia: joined together, bound as one."]],"gen":null,"macron":false,"tip":null},{"id":"n1-intro","name":"Introductions","code":"N1.2","pairs":[["Ko wai tō ingoa?","What is your name?"],["Ko wai koe?","Who are you?"],["Ko wai ia?","Who is he/she/they?"],["Ko wai tana ingoa?","What is his/her/their name?"],["Ingoa","Name"],["Ia","He; she; they (one person)"],["Kei te pēhea koe?","How are you?"],["Kei te pai ahau","I am good"],["E hia ō tau?","How old are you?"]],"sents":[["Ko wai tō ingoa?","What is your name?"],["Ko Ava taku ingoa","My name is Ava"],["Ko wai koe?","Who are you?"],["Ko Hēmi au","I am Hēmi"],["Ko wai tana ingoa?","What is their name?"],["Ko Poppy ia","That is Poppy"]],"qa":[["Ko wai tō ingoa?","Ko Mere taku function genQuestion(t, used, speed){
  const kinds = []; const add = (k, w) => { for (let i = 0; i < w; i++) kinds.push(k); };
  if (t.gen) add(t.gen, 5);
  add('qa', t.qa.length ? 4 : 0); add('vocab', t.pairs.length >= 4 ? 3 : 0); add('macron', t.macron ? 4 : 1);
  if (!speed) { add('build', t.sents.length ? 2 : 0); add('type', t.pairs.length ? 1 : 0); add('match', t.pairs.length >= 4 ? 1 : 0); }
  for (let k = 0; k < 40; k++) { const g = GEN[pick(kinds)]; const q = g && g(t); if (q && !used.has(q.key)) { used.add(q.key); return q; } }
  for (let k = 0; k < 20; k++) { const q = GEN.qa(t) || GEN.vocab(t); if (q) return q; }
  return null;
}
function buildQuiz(course, topics, n, speed){
  const T = G[course].topics.filter(t => topics.includes(t.id)); const used = new Set(), qs = []; let cyc = [];

  return qs;
}

const ATTRS = {
  n1:[ ['age', () => 10 + Math.floor(Math.random() * 7), v => lead(v) + ' ana tau.', v => v + ' years old'],
       ['home', () => pick(PLACES_K), v => `Kei ${v[0]} tana kāinga.`, v => 'Home: ' + v[1]],

       ['pet', () => pick([['ngeru','a cat'],['kurī','a dog'],['hōiho','a horse']]), v => `He ${v[0]} tāna.`, v => 'Has ' + v[1]] ]

function mataiRound(course){
  const A = ATTRS[course]; const key = v => JSON.stringify(v);
  for (let tries = 0; tries < 500; tries++) {
    const names = shuffle(NAMES).slice(0, 6), faces = shuffle(FACES);
    const sus = names.map((n, i) => ({ n, f:faces[i], a:Object.fromEntries(A.map(([k, g]) => [k, g()])) }));
    const target = Math.floor(Math.random() * 6), T = sus[target].a;
    sus.forEach((x, i) => { if (i === target) return; shuffle(A.map(a => a[0])).slice(0, 1 + Math.floor(Math.random() * 2)).forEach(k => { x.a[k] = JSON.parse(key(T[k])); }); });
    const order = shuffle(A.map(x => x[0])); let left = sus.map((_, i) => i); const used = [];
    for (const k of order) { const nl = left.filter(i => key(sus[i].a[k]) === key(T[k])); if (nl.length < left.length || !used.length) { used.push(k); left = nl; } if (left.length === 1) break; }
    if (left.length !== 1 || used.length < 3) continue;
    return { sus, target, clues:used.map(k => { const d = A.find(x => x[0] === k); return [d[2](T[k]), d[3](T[k])]; }) };
  }
}
